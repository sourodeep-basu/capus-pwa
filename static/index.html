<script>
const $=id=>document.getElementById(id),K='campus_life_v1';

try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
S.ntf=Object.assign({on:false,lead:30,rt:'20:00',st:'21:30',qs:'',qe:'',sent:{}},S.ntf||{});S.lbm=S.lbm||'focus_week';S.pomo=Object.assign({f:25,s:5,l:15,n:4,auto:true},S.pomo||{});S.tmode=S.tmode||'timer';S.goals=S.goals||[];S.cards=S.cards||[];S.nts=S.nts||[];S.sav=S.sav||[];S.jobs=S.jobs||[];S.del=S.del||{};S._m=S._m||{};S.tc=Object.assign({wake:true,sound:true,vib:true,noise:'off',vol:30},S.tc||{});if(S.locked&&!S.pin)S.locked=false;S.dgoal=S.dgoal||180;S.xk=S.xk||{};S.bd=S.bd||{};S.bud=S.bud||{};S.bsent=S.bsent||{};S.led=S.led||[];S.ex=S.ex||[];S.gr=S.gr||[];S.tg=S.tg||{t:0,r:0};
const store=(keep)=>{if(!keep){S._ts=Date.now();trackChanges()}try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(window.indexedDB)IDB.set('state',S).catch(()=>{});if(!keep)dirty()};
const save=()=>{checkBadges();store();schedSync()};
let view='home',menu=false,calc='',keypadOpen=window.matchMedia('(max-width: 767px)').matches,selectedFiles={},editName=false,confirmCb=null,confirmCancel=null,confirmMsg='',recog=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const td=()=>dk(),mo=()=>dk().slice(0,7);
const inr=n=>'\u20B9'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const hm=m=>Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'m';
const v=id=>($(id)?$(id).value.trim():'');
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2200)}
function theme(){const dark=S.theme?S.theme==='dark':true;document.documentElement.classList.toggle('dark',dark);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?'#111111':'#FBA857';return dark}
function setTheme(){S.theme=theme()?'light':'dark';save();render()}
function go(x){view=x;menu=false;render();const m=document.querySelector('main');if(m)m.classList.add('enter');if(x==='soc'){loadSoc();loadHealth()}scrollTo(0,0)}
function ask(m,cb,cancel){confirmMsg=m;confirmCb=cb;confirmCancel=cancel||null;ovr()}
const card='rounded-3xl bg-white dark:bg-slate-800/70 border border-slate-200/80 dark:border-slate-700/60 p-5 shadow-[0_1px_2px_rgba(60,50,30,.04),0_10px_30px_-14px_rgba(60,50,30,.14)]',
inp='w-full rounded-xl border border-slate-200 dark:border-slate-600/60 bg-slate-50 dark:bg-slate-900/60 px-3.5 py-2.5 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400/40 focus:border-indigo-400',
em=t=>`<div class="text-sm text-slate-500 dark:text-slate-400 py-6 px-4 text-center rounded-2xl border border-dashed border-slate-300 dark:border-slate-600/70">${t}</div>`;
const btn=(l,o,c)=>`<button onclick="${o}" class="tap rounded-xl px-3.5 py-2 text-sm font-medium ${c||'bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-700/60 dark:hover:bg-slate-700 dark:text-slate-200'}">${l}</button>`;
const removeBtn=(o,l='Remove')=>`<button type="button" onclick="${o}" class="tap remove-action" aria-label="${esc(l)}" title="${esc(l)}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button>`;
const pbar=(p,c)=>`<div class="h-2 rounded-full bg-slate-200/80 dark:bg-slate-700/70 overflow-hidden"><div class="h-full ${c} rounded-full transition-all" style="width:${Math.min(100,Math.max(0,p))}%"></div></div>`;
const AC={home:'251,168,87',money:'254,198,116',att:'217,121,36',hab:'254,198,116',task:'251,168,87',foc:'217,121,36',jr:'254,198,116',acad:'251,168,87',ins:'217,121,36',soc:'254,198,116',study:'251,168,87',job:'217,121,36'};
const banner=(g,b,t,s)=>`<div class="page-heading"><div class="page-heading-copy"><span class="page-heading-kicker">${esc(b)}</span><h2>${t}</h2>${s?`<p>${s}</p>`:''}</div></div>`;
const sec=(t,dot,body,extra='')=>`<section class="${card} ${extra}"><h3 class="font-semibold mb-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full ${dot}"></span>${t}</h3>${body}</section>`;
const ic={home:'M3 12l9-9 9 9M5 10v10h14V10',money:'M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6',att:'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11',hab:'M13 2L3 14h9l-1 8 10-12h-9l1-8z',task:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',foc:'M12 6v6l4 2M12 22a10 10 0 100-20 10 10 0 000 20z',jr:'M4 19.5A2.5 2.5 0 016.5 17H20V2H6.5A2.5 2.5 0 004 4.5v15z',acad:'M22 10L12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5',ins:'M18 20V10M12 20V4M6 20v-6',soc:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75',study:'M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z',job:'M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16'};

const tabs=[['home','Overview','home'],['money','Finances','money'],['att','Attendance','att'],['hab','Routines','hab'],['task','Planner','task'],['foc','Study Timer','foc'],['jr','Reflection','jr'],['acad','Academics','acad'],['syl','Syllabus','study'],['ins','Insights','ins'],['soc','Friends','soc'],['study','Study Hub','study'],['job','Career','job']];
const accts=S.accts=S.accts||['UPI / Bank','Cash','Campus Wallet'],cats=S.cats=S.cats||['Food & Canteen','Books & Lab','Transit','Subscriptions','Stipend / Earned','Allowance'],catLabel=c=>c==='Stationary'?'Stationery':c;

let expandedLists={};
function listView(key,items,renderItem){const shown=expandedLists[key]?items:items.slice(0,4);return shown.map(renderItem).join('')+(items.length>4?`<button onclick="expandedLists['${key}']=!expandedLists['${key}'];render()" class="tap mt-2 text-sm font-semibold text-indigo-700 dark:text-indigo-300 underline">${expandedLists[key]?'View less':'View more ('+(items.length-4)+' more)'}</button>`:'')}
function addMood(){const el=$('newMood'),m=(el?.value||'').trim();if(!m)return toast('Enter a mood');if(m.length>24)return toast('Keep mood names under 25 characters');if(moods.some(x=>x.toLowerCase()===m.toLowerCase()))return toast('That mood already exists');moods.push(m);save();render()}
function editMood(i){const el=$('mood'+i),m=(el?.value||'').trim();if(!m)return toast('Mood name cannot be empty');if(m.length>24)return toast('Keep mood names under 25 characters');if(moods.some((x,j)=>j!==i&&x.toLowerCase()===m.toLowerCase()))return toast('That mood already exists');const old=moods[i];moods[i]=m;S.journal.forEach(e=>{if(e.mood===old)e.mood=m});if(S.mood===old)S.mood=m;save();render()}

/* derived */
const isIn=x=>x.t==='income';
const sum=(l,f)=>l.filter(f).reduce((a,x)=>a+x.a,0);
const spentD=()=>sum(S.tx,x=>!isIn(x)&&x.date===td()),earnD=()=>sum(S.tx,x=>isIn(x)&&x.date===td());
const spentM=()=>sum(S.tx,x=>!isIn(x)&&x.date.startsWith(mo())),earnM=()=>sum(S.tx,x=>isIn(x)&&x.date.startsWith(mo()));
const focD=()=>S.sess.filter(x=>x.date===td()).reduce((a,x)=>a+x.m,0);
const cA=c=>c.log.filter(l=>l.p).length,cT=c=>c.log.length,cP=c=>cT(c)?cA(c)/cT(c)*100:0;

function initSig(){SIG={};S._m=S._m||{};S.del=S.del||{};COLS.forEach(c=>(S[c]||[]).forEach(it=>{if(!it.id)return;SIG[it.id]=JSON.stringify(it);if(S._m[it.id]===undefined)S._m[it.id]=S._ts||0}))}
// Called on every save: stamps changed items and records deletions as tombstones.
function trackChanges(){if(!SIG)return;const now=Date.now(),seen={};S._m=S._m||{};S.del=S.del||{};
COLS.forEach(c=>(S[c]||[]).forEach(it=>{if(!it.id)return;seen[it.id]=1;const sg=JSON.stringify(it);if(SIG[it.id]!==sg){S._m[it.id]=now;SIG[it.id]=sg}}));
for(const id in SIG)if(!seen[id]){S.del[id]=now;delete SIG[id];delete S._m[id]}
for(const id in S.del)if(now-S.del[id]>90*864e5)delete S.del[id]}
function mergeStates(L,R){const win=(L._ts||0)>=(R._ts||0)?L:R,lose=win===L?R:L,out={...lose,...win},mL=L._m||{},mR=R._m||{},m={},del={};
for(const k of new Set([...Object.keys(L.del||{}),...Object.keys(R.del||{})]))del[k]=Math.max((L.del||{})[k]||0,(R.del||{})[k]||0);
COLS.forEach(c=>{const a=L[c]||[],b=R[c]||[],ia=new Map(a.map(x=>[x.id,x])),ib=new Map(b.map(x=>[x.id,x])),list=[];
 [...a,...b.filter(x=>!ia.has(x.id))].forEach(x=>{const xl=ia.get(x.id),xr=ib.get(x.id),tl=xl?(mL[x.id]||0):-1,tr=xr?(mR[x.id]||0):-1,t=Math.max(tl,tr);
  if(del[x.id]&&del[x.id]>=t)return; // deleted on one device after its last edit
  let it=tr>tl?xr:xl;if(xl&&xr&&c==='habits'){const w=tr>tl?xr:xl,o=w===xr?xl:xr;it={...w,days:{...o.days,...w.days}}}
  list.push(it);m[x.id]=Math.max(t,0)});
 if(NEWEST_FIRST.includes(c))list.sort((p,q)=>String(q.id).localeCompare(String(p.id)));out[c]=list});
const un=(k)=>{const o={...(R[k]||{}),...(L[k]||{})};for(const x in (R[k]||{}))o[x]=typeof o[x]==='number'?Math.max(o[x],R[k][x]):o[x];return o};
out.xk=un('xk');out.bd=un('bd');out.bsent=un('bsent');out._m=m;out.del=del;out.ntf=L.ntf;out._ts=Math.max(L._ts||0,R._ts||0);return out}

const GT={focus:'Focus hours',tasks:'Tasks completed',habits:'Habit check-ins',syl:'Syllabus topics',cls:'Classes attended'};
const wkR=o=>{const a=new Date();a.setDate(a.getDate()-((a.getDay()+6)%7)+o*7);const b=new Date(a);b.setDate(a.getDate()+6);return[dk(a),dk(b)]},inW=(d,r)=>!!d&&d>=r[0]&&d<=r[1];

const gfmt=(g,x)=>g.t==='focus'?x.toFixed(1):String(Math.round(x));
function goalBar(g,o){const x=gv(g,o),p=x/g.n*100;return `<div class="mb-3"><div class="flex justify-between text-sm"><span>${GT[g.t]}</span><span class="font-mono ${p>=100?'text-emerald-600':''}">${gfmt(g,x)} / ${g.n}</span></div>${pbar(p,p>=100?'bg-emerald-500':'bg-indigo-500')}</div>`}
const goalHome=()=>`<div class="md:col-span-2">${sec('Weekly Goals','bg-amber-500',S.goals.length?S.goals.map(g=>goalBar(g,0)).join(''):em('No weekly goals yet. Set some in Planner.'))}</div>`;

function delGoal(id){S.goals=S.goals.filter(g=>g.id!==id);save();render()}
function goalSec(){const r=wkR(-1),sp=sum(S.tx,t=>!isIn(t)&&inW(t.date,r)),mc={};S.journal.filter(e=>inW(e.date,r)).forEach(e=>mc[e.mood]=(mc[e.mood]||0)+1);const mt=Object.entries(mc).sort((a,b)=>b[1]-a[1])[0],hit=S.goals.filter(g=>gv(g,-1)>=g.n).length;
return `<section class="${card} mt-4"><h3 class="font-semibold mb-1">Weekly Goals</h3><p class="text-xs text-slate-500 mb-3">Progress for this week, Monday to Sunday.</p>${S.goals.map(g=>`<div class="flex items-start gap-3"><div class="flex-1 min-w-0">${goalBar(g,0)}</div>${removeBtn(`delGoal('${g.id}')`)}</div>`).join('')||em('No goals yet. Add one below.')}<div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-2"><select id="gtt" class="${inp}">${Object.entries(GT).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><input id="gtn" type="number" min="1" step="any" class="${inp}" placeholder="Weekly target"><button onclick="addGoal()" class="tap rounded-xl bg-indigo-600 text-white font-semibold">Add Goal</button></div>
<details class="mt-4"><summary class="tap cursor-pointer font-medium flex items-center">Last week's review</summary><div class="mt-2 text-sm">${S.goals.map(g=>{const x=gv(g,-1);return `<div class="flex justify-between py-1"><span>${GT[g.t]}</span><span class="font-mono">${gfmt(g,x)} / ${g.n} ${x>=g.n?'(hit)':'(missed)'}</span></div>`}).join('')}${S.goals.length?`<p class="mt-2">You hit ${hit} of ${S.goals.length} goals.</p>`:''}<p class="mt-2 text-slate-600 dark:text-slate-300">Last week you focused ${hm(gv({t:'focus'},-1)*60)}, finished ${gv({t:'tasks'},-1)} tasks, logged ${gv({t:'habits'},-1)} habit check-ins, attended ${gv({t:'cls'},-1)} classes and spent ${inr(sp)}. Most common mood: ${mt?mt[0]:'none logged'}.</p></div></details></section>`}

function actx(){try{AUDIO=AUDIO||new(window.AudioContext||window.webkitAudioContext)();if(AUDIO.state==='suspended')AUDIO.resume();return AUDIO}catch(e){return null}}

function icsDate(s){const m=/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)?(Z)?$/.exec((s||'').trim());if(!m)return null;const a=m.slice(1,6).map(Number);return{d:m[7]?new Date(Date.UTC(a[0],a[1]-1,a[2],a[3],a[4])):new Date(a[0],a[1]-1,a[2],a[3],a[4]),z:!!m[7]}}

L.forEach(l=>{if(l.startsWith('BEGIN:VEVENT'))c={};else if(l.startsWith('END:VEVENT')){if(c)evs.push(c);c=null}else if(c){const i=l.indexOf(':');if(i>0)c[l.slice(0,i).split(';')[0]]=l.slice(i+1).replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\n/gi,' ')}});

const bd=/BYDAY=([^;]+)/.exec(rr),days=(bd?bd[1].split(',').map(x=>DM[x.slice(-2)]):[a.d.getDay()]).filter(x=>x!==undefined),sh=a.z?(a.d.getDay()-a.d.getUTCDay()+7)%7:0,name=e.SUMMARY.trim();

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4"><section class="${card}"><div class="flex gap-2 mb-2">${btn('+15m',"logSess(15,v('ftopic'))")}${btn('+30m',"logSess(30,v('ftopic'))")}</div><h3 class="font-semibold mb-1">Logged Focus Sessions</h3>${listView('sessions',S.sess,x=>`<div class="flex justify-between text-sm py-1 border-b border-slate-100 dark:border-slate-700"><span>${esc(x.s&&x.s!==x.t?x.s+' - '+x.t:x.t)} <span class="text-xs text-slate-500">${x.date}</span></span><b class="font-mono">${hm(x.m)}</b></div>`)||em('No sessions logged yet.')}</section>
<section class="${card}"><h3 class="font-semibold mb-2">Study Notes</h3><textarea class="${inp} h-40" placeholder="Jot down notes" oninput="S.notes=this.value;save()">${esc(S.notes)}</textarea></section></div>`}
function vJr(){const lk=S.locked&&!!S.pin;
return banner('from-fuchsia-900 via-purple-950 to-slate-900','Reflection','Daily Journal','Capture your mood and thoughts')+(lk?`<section class="${card} mt-4 text-center"><h3 class="font-semibold mb-2">Diary Locked</h3><input id="pin" type="password" inputmode="numeric" class="${inp} max-w-xs mx-auto" placeholder="Enter your PIN" onkeydown="if(event.key==='Enter')unlock()"><button onclick="unlock()" class="tap mt-3 rounded-xl bg-fuchsia-600 text-white px-4 py-2 font-semibold">Unlock</button>${forgotPin()}</section>`:`<section class="${card} mt-4"><div class="flex flex-wrap gap-2 mb-3">${moods.map((m,i)=>btn(esc(m),`S.mood=moods[${i}];save();render()`,S.mood===m?'bg-fuchsia-600 text-white':'')).join('')}</div><div class="journal-prompt rounded-xl p-3 flex items-center justify-between gap-2 mb-3"><span class="text-sm">${prompts[S.pi%prompts.length]}</span>${btn('Next Prompt',"S.pi++;save();render()")}</div><textarea id="jt" class="${inp} h-36" placeholder="Write your thoughts"></textarea><div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2">${btn('Save Entry','saveEntry()','bg-fuchsia-600 text-white')}${btn('Voice Input','voice()')}${btn('Reflective Summary','summ()')}${btn('Lock Diary','lockDiary()')}</div><p id="sm" class="text-sm mt-3 text-slate-600 dark:text-slate-300"></p><details class="mt-4"><summary class="tap cursor-pointer text-sm font-semibold">Manage moods</summary><div class="grid gap-2 mt-3">${moods.map((m,i)=>`<div class="flex gap-2"><input id="mood${i}" maxlength="24" class="${inp}" value="${esc(m)}" aria-label="Mood name"><button onclick="editMood(${i})" class="tap rounded-xl px-3 bg-emerald-600 text-white">Save</button></div>`).join('')}<div class="flex gap-2"><input id="newMood" maxlength="24" class="${inp}" placeholder="Add a mood"><button onclick="addMood()" class="tap rounded-xl px-3 bg-emerald-600 text-white">Add</button></div></div></details></section><section class="${card} mt-4"><h3 class="font-semibold mb-2">Entries</h3>${listView('journal',S.journal,e=>`<div class="py-2 border-b border-slate-100 dark:border-slate-700 text-sm"><b>${esc(e.mood)}</b> <span class="text-xs text-slate-500">${e.date}</span><p class="mt-1 whitespace-pre-wrap">${esc(e.text)}</p></div>`)||em('No journal entries yet.')}</section>${pinSec()}`)}
const V={home:vHome,money:vMoney,att:vAtt,hab:vHab,task:vTask,foc:vFoc,jr:vJr,acad:vAcad,syl:vSyl,ins:vIns,soc:vSoc,study:vStudy,job:vJob};
initSig();if(window.indexedDB)IDB.set('base',BASE).catch(()=>{});
/* boot: reconcile IndexedDB with the localStorage mirror, then wire up background behaviour */
if(window.indexedDB)(async()=>{try{const d=await IDB.get('state');if(!d){await IDB.set('state',S);if(AUTH)IDB.set('auth',AUTH);return}if((d._ts||0)>(S._ts||0)&&!sessionStorage.getItem('cl_rl')){sessionStorage.setItem('cl_rl','1');d.ntf=S.ntf;localStorage.setItem(K,JSON.stringify(d));location.reload()}else sessionStorage.removeItem('cl_rl')}catch(e){}})();
if(window.addEventListener&&document.addEventListener){if('serviceWorker' in navigator&&navigator.serviceWorker.addEventListener)navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='cmds')applyCmds()});window.addEventListener('online',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(!document.hidden){applyCmds();syncNow();if(TM.run)comfort()}})}
setTimeout(()=>{applyCmds();syncNow();if(AUTH&&S.calUrl&&navigator.onLine!==false&&Date.now()-(S.calAt||0)>864e5)calFetch()},2500);
setTimeout(tmRestore,0);
setInterval(()=>check(),30000);setTimeout(()=>check(),1500);setTimeout(()=>schedSync(),2500);
const navGroups=[['Today',[['home','Overview','home'],['task','Planner','task'],['hab','Routines','hab'],['foc','Study Timer','foc'],['jr','Reflection','jr']]],['Campus',[['att','Attendance','att'],['acad','Academics','acad'],['syl','Syllabus','study'],['study','Study Hub','study']]],['Life',[['money','Finances','money'],['ins','Insights','ins'],['soc','Friends','soc'],['job','Career','job']]]];
const navItems=()=>navGroups.map(([group,items])=>`<section class="nav-group col-span-2"><h2 class="nav-section-label">${group}</h2><div class="nav-group-links">${items.map(t=>`<button onclick="go('${t[0]}')" class="tap nav-link ${view===t[0]?'is-active':''}" ${view===t[0]?'aria-current="page"':''}>${icon(t[2])}<span>${t[1]}</span></button>`).join('')}</div></section>`).join('');
function render(){const dark=theme(),ini=(S.name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(),w=S.wide?'max-w-5xl':'max-w-lg',l=lvl();
const side=`<aside class="app-sidebar menu-sidebar hidden md:flex md:flex-col shrink-0"><div class="brand-lockup"><div class="brand-name">Campus Life <em>Tracker</em></div></div><nav class="mt-1 flex-1 overflow-y-auto">${navItems()}</nav><div class="sidebar-footer"><button onclick="editName=true;ovr()" class="sidebar-profile tap flex w-full items-center gap-3 text-left"><span class="sidebar-avatar">${esc(ini)}</span><span class="min-w-0 flex-1 truncate">${esc(S.name||'Your profile')}</span></button><div class="sidebar-tools">${btn(dark?'Light mode':'Dark mode','setTheme()')}${btn(S.wide?'Compact':'Wide view',"S.wide=!S.wide;save();render()")}</div></div></aside>`;
const mobile=`<header class="mobile-app-header app-mobile-header"><button onclick="go('home')" class="tap mobile-brand">Campus Life <em>Tracker</em></button><div class="flex gap-2">${btn(dark?'Light':'Dark','setTheme()')}${btn(menu?'Close':'Menu',"menu=!menu;render()")}</div>${menu?`<nav class="mobile-navigation">${navItems()}</nav>`:''}</header>`;
$('app').innerHTML=`<div class="app-shell md:flex">${side}<div class="flex-1 min-w-0">${mobile}<main class="app-main ${w}">${V[view]()}</main></div></div>`;ovr()}

render();
</script></body></html>
