<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campus Life Tracker</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Campus Life">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{overflow-x:hidden;max-width:100vw;font-family:Inter,system-ui,sans-serif}
button,input,select,textarea,.tap{min-height:44px;min-width:44px}
input[type=checkbox]{min-height:24px;min-width:24px}
img,svg{max-width:100%;height:auto}
@media(max-width:767px){body,input,select,textarea,button{font-size:16px}}
.flip{font-family:'JetBrains Mono',monospace}
</style></head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100">
<div id="app"></div><div id="ov"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-xl bg-slate-900 text-white text-sm shadow-lg dark:bg-white dark:text-slate-900"></div>
<script>
const $=id=>document.getElementById(id),K='campus_life_v1';
let S={name:'',theme:null,wide:true,tx:[],courses:[],habits:[],tasks:[],syl:[],sess:[],journal:[],ml:[],notes:'',mood:'',pi:0,locked:false,tf:'all',xf:'all',hv:'grid',fm:'ring',dur:25,tt:'expense'};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
S.ntf=Object.assign({on:false,lead:30,rt:'20:00',sent:{}},S.ntf||{});S.xk=S.xk||{};S.bd=S.bd||{};
const store=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const save=()=>{checkBadges();store();schedSync()};
let view='home',menu=false,calc='',rem=S.dur*60,run=false,iv=null,editName=false,confirmCb=null,confirmMsg='',recog=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const td=()=>dk(),mo=()=>dk().slice(0,7);
const inr=n=>'\u20B9'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const hm=m=>Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'m';
const v=id=>($(id)?$(id).value.trim():'');
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2200)}
function theme(){const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',dark);return dark}
function setTheme(){S.theme=theme()?'light':'dark';save();render()}
function go(x){view=x;menu=false;render();scrollTo(0,0)}
function ask(m,cb){confirmMsg=m;confirmCb=cb;ovr()}
const card='rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4',
inp='w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2',
em=t=>`<p class="text-sm text-slate-500 dark:text-slate-400 py-3">${t}</p>`;
const btn=(l,o,c)=>`<button onclick="${o}" class="tap rounded-xl px-3 py-2 text-sm font-medium ${c||'bg-slate-200 dark:bg-slate-700'}">${l}</button>`;
const pbar=(p,c)=>`<div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-full ${c} rounded-full" style="width:${Math.min(100,Math.max(0,p))}%"></div></div>`;
const banner=(g,b,t,s)=>`<div class="rounded-2xl bg-gradient-to-br ${g} text-white p-5"><span class="text-xs font-semibold uppercase tracking-wider bg-white/15 rounded-full px-2 py-1">${b}</span><h2 class="text-2xl font-bold mt-2">${t}</h2><p class="text-sm text-white/70">${s}</p></div>`;
const stat=(l,val,c)=>`<div class="rounded-xl bg-white/10 backdrop-blur p-3"><div class="text-xs text-white/70">${l}</div><div class="font-mono font-bold text-lg ${c||''}">${val}</div></div>`;
const sec=(t,dot,body)=>`<section class="${card}"><h3 class="font-semibold mb-2 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ${dot}"></span>${t}</h3>${body}</section>`;
const ic={home:'M3 12l9-9 9 9M5 10v10h14V10',money:'M12 2v20M17 6H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6',att:'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11',hab:'M13 2L3 14h9l-1 8 10-12h-9l1-8z',task:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',foc:'M12 6v6l4 2M12 22a10 10 0 100-20 10 10 0 000 20z',jr:'M4 19.5A2.5 2.5 0 016.5 17H20V2H6.5A2.5 2.5 0 004 4.5v15z'};
const icon=k=>`<svg class="w-5 h-5 inline" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${ic[k]}"/></svg>`;
const tabs=[['home','Overview','home'],['money','Finances','money'],['att','Attendance','att'],['hab','Routines','hab'],['task','Planner','task'],['foc','Study Timer','foc'],['jr','Reflection','jr']];
const accts=['UPI / Bank','Cash','Campus Wallet'],cats=['Food & Canteen','Books & Lab','Transit','Subscriptions','Stipend / Earned','Allowance'];
const moods=['Great','Focused','Calm','Tired','Stressed'],prompts=['What went well today, and why?','What is one thing you would do differently?','What are you grateful for right now?','What is weighing on your mind?','What is your single priority for tomorrow?'];

/* derived */
const isIn=x=>x.t==='income';
const sum=(l,f)=>l.filter(f).reduce((a,x)=>a+x.a,0);
const spentD=()=>sum(S.tx,x=>!isIn(x)&&x.date===td()),earnD=()=>sum(S.tx,x=>isIn(x)&&x.date===td());
const spentM=()=>sum(S.tx,x=>!isIn(x)&&x.date.startsWith(mo())),earnM=()=>sum(S.tx,x=>isIn(x)&&x.date.startsWith(mo()));
const focD=()=>S.sess.filter(x=>x.date===td()).reduce((a,x)=>a+x.m,0);
const cA=c=>c.log.filter(l=>l.p).length,cT=c=>c.log.length,cP=c=>cT(c)?cA(c)/cT(c)*100:0;
const marked=c=>c.log.some(l=>l.d===td());
const ovAtt=()=>{const a=S.courses.reduce((s,c)=>s+cA(c),0),t=S.courses.reduce((s,c)=>s+cT(c),0);return t?a/t*100:0};
const hDone=h=>!!h.days[td()];
function streak(h){let d=new Date(),n=0;if(!h.days[dk(d)])d.setDate(d.getDate()-1);while(h.days[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
const score=()=>{const hr=S.habits.length?S.habits.filter(hDone).length/S.habits.length:0,tr=S.tasks.length?S.tasks.filter(t=>t.done).length/S.tasks.length:0,fr=Math.min(1,focD()/180);return Math.round(hr*35+tr*30+fr*35)};
const pb=p=>`<span class="text-xs font-semibold rounded-full px-2 py-0.5 ${p==='High'?'bg-rose-100 text-rose-700':p==='Medium'?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700'}">${p}</span>`;

/* actions */
function mark(i,p){const c=S.courses[i];c.log.push({d:td(),p});if(p)award('p:'+c.id+':'+c.log.length,5);save();render();toast(p?'Marked present (+5 XP)':'Marked absent')}
function undo(i){const c=S.courses[i];if(!c.log.length)return toast('Nothing to undo');delete S.xk['p:'+c.id+':'+c.log.length];c.log.pop();save();render()}
function addCourse(){const n=v('cn');if(!n)return toast('Enter a course name');S.courses.push({id:uid(),n,r:v('cr'),log:[],sl:[]});save();render()}
function delCourse(i){ask('Remove this course and its records?',()=>{S.courses.splice(i,1);save();render()})}
function tog(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;t.done?award('t:'+id,t.p==='High'?30:t.p==='Medium'?20:10):delete S.xk['t:'+id];save();render()}
function addTask(){const t=v('tt1');if(!t)return toast('Enter a task title');S.tasks.push({id:uid(),t,c:v('tc'),due:v('tdue'),p:$('tp').value,done:false});save();render()}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
function addSyl(){const s=v('ss'),t=v('st');if(!s||!t)return toast('Enter subject and topic');S.syl.push({id:uid(),s,t,done:false});save();render()}
function togSyl(id){const x=S.syl.find(y=>y.id===id);x.done=!x.done;x.done?award('y:'+id,10):delete S.xk['y:'+id];save();render()}
function delSyl(id){S.syl=S.syl.filter(x=>x.id!==id);save();render()}
function addHabit(){const n=v('hn');if(!n)return toast('Enter a habit name');S.habits.push({id:uid(),n,days:{}});save();render()}
function togH(id,d){const h=S.habits.find(x=>x.id===id),k='h:'+id+':'+d;if(h.days[d]){delete h.days[d];delete S.xk[k]}else{h.days[d]=true;award(k,10);const s=streak(h);if(s>0&&s%7===0)award('sb:'+id+':'+s,50)}save();render()}
function delH(id){ask('Remove this habit?',()=>{S.habits=S.habits.filter(x=>x.id!==id);save();render()})}
function logMl(){const h=$('mh').value,n=v('mn');if(!h||!n)return toast('Select a habit and write a note');S.ml.unshift({id:uid(),h,n,date:td()});save();render()}
function key(k){if(k==='C')calc='';else if(k==='='){const r=ev();calc=r==null?'':String(r)}else calc+=k;$('cd').textContent=calc||'0'}
function ev(){const s=calc.replace(/[^0-9+\-*.]/g,'');if(!s)return null;try{const r=Function('return '+s)();return isFinite(r)?Math.round(r*100)/100:null}catch(e){return null}}
function addTx(){const a=ev();if(!(a>0))return toast('Enter a valid amount');S.tx.unshift({id:uid(),t:S.tt,a,d:v('md')||'No description',c:$('mc').value,ac:$('ma').value,date:td()});if(S.tx.filter(x=>x.date===td()).length<=3)award('x:'+S.tx[0].id,2);calc='';save();render();toast('Transaction saved')}
function delTx(id){S.tx=S.tx.filter(x=>x.id!==id);save();render()}
function resetBal(){ask('Reset all balances? This removes every transaction.',()=>{S.tx=[];save();render()})}
function setDur(m){if(run)pause();S.dur=m;rem=m*60;save();render()}
function start(){if(run)return;if(rem<=0)rem=S.dur*60;run=true;iv=setInterval(tick,1000);upd()}
function pause(){run=false;clearInterval(iv);upd()}
function reset(){pause();rem=S.dur*60;upd()}
function tick(){rem--;if(rem<=0){rem=0;pause();logSess(S.dur,v('ftopic'));rem=S.dur*60;notify('Focus session complete',S.dur+' minutes logged.')}upd()}
function logSess(m,t){if(m<1)return toast('Nothing to log yet');const o={id:uid(),m,t:t||'General study',date:td()};S.sess.unshift(o);award('s:'+o.id,Math.min(m,120));save();if(view==='foc'||view==='home')render()}
function logCur(){const m=Math.round((S.dur*60-rem)/60);if(m<1)return toast('Run the timer for at least a minute first');pause();logSess(m,v('ftopic'));rem=S.dur*60;render()}
function upd(){if(view!=='foc'||!$('tm'))return;const m=String(Math.floor(rem/60)).padStart(2,'0'),s=String(rem%60).padStart(2,'0');$('tm').textContent=m+':'+s;if($('fm1')){$('fm1').textContent=m;$('fs1').textContent=s}const r=$('ring');if(r)r.setAttribute('stroke-dashoffset',(1-rem/(S.dur*60))*565);$('sb').textContent=run?'Pause':'Start';$('sb').onclick=run?pause:start}
function saveEntry(){const t=v('jt');if(!S.mood)return toast('Select a mood first');if(!t)return toast('Write something first');const o={id:uid(),date:td(),mood:S.mood,text:t};S.journal.unshift(o);award('j:'+o.id,15);save();render();toast('Entry saved (+15 XP)')}
function summ(){if(!S.journal.length){$('sm').textContent='Save a few entries first to generate a summary.';return}const c={};S.journal.forEach(e=>c[e.mood]=(c[e.mood]||0)+1);const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0],w=Math.round(S.journal.reduce((a,e)=>a+e.text.split(/\s+/).length,0)/S.journal.length);$('sm').textContent=S.journal.length+' entries. Most frequent mood: '+top+'. Average length: '+w+' words. Latest note: '+S.journal[0].text.slice(0,120)}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input is not supported in this browser');if(recog){recog.stop();recog=null;return}recog=new R();recog.continuous=true;recog.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript+' ';$('jt').value+=t};recog.onend=()=>{recog=null};recog.start();toast('Listening')}
function unlock(){if(v('pin')==='1234'){S.locked=false;save();render()}else toast('Incorrect PIN')}
function saveName(){const n=v('nn');if(!n)return toast('Please enter a name');S.name=n;editName=false;save();render()}

/* xp, levels, badges, timetable */
const lvlNames=['Newcomer','Learner','Scholar','Achiever','Strategist','Specialist','Expert','Master','Legend'];
const xpTotal=()=>Object.values(S.xk).reduce((a,b)=>a+b,0);
function lvl(){const x=xpTotal(),L=Math.floor(Math.sqrt(x/50))+1;return{x,L,a:50*(L-1)**2,b:50*L**2,name:lvlNames[Math.min(L-1,lvlNames.length-1)]}}
function award(k,p){const l0=lvl().L;S.xk[k]=p;const l1=lvl().L;if(l1>l0)toast('Level up! You reached level '+l1)}
const focT=()=>S.sess.reduce((a,x)=>a+x.m,0),bestStreak=()=>Math.max(0,...S.habits.map(streak));
const BADGES=[
['b1','First Steps','Complete a habit',()=>S.habits.some(h=>Object.keys(h.days).length)],
['b2','Focused Hour','Log 60 minutes of focus in total',()=>focT()>=60],
['b3','Deep Work','Log a single session of 50+ minutes',()=>S.sess.some(x=>x.m>=50)],
['b4','Study Marathon','Log 10 hours of focus in total',()=>focT()>=600],
['b5','Week Warrior','Reach a 7-day habit streak',()=>bestStreak()>=7],
['b6','Task Crusher','Complete 10 tasks',()=>S.tasks.filter(t=>t.done).length>=10],
['b7','On Track','Keep attendance at 75% or more across 10+ classes',()=>S.courses.reduce((s,c)=>s+cT(c),0)>=10&&ovAtt()>=75],
['b8','Syllabus Slayer','Finish every topic of a subject with 5+ topics',()=>[...new Set(S.syl.map(x=>x.s))].some(s=>{const it=S.syl.filter(x=>x.s===s);return it.length>=5&&it.every(x=>x.done)})],
['b9','Money Minded','Log 20 transactions',()=>S.tx.length>=20],
['b10','Reflective','Write 7 journal entries',()=>S.journal.length>=7],
['b11','Perfect Day','Reach a Day Score of 100%',()=>score()===100],
['b12','Rising Star','Reach level 5',()=>lvl().L>=5]];
function checkBadges(){let n=0;BADGES.forEach(b=>{if(!S.bd[b[0]]&&b[3]()){S.bd[b[0]]=td();n++;toast('Badge unlocked: '+b[1])}});if(n)store()}
function xpCard(){const l=lvl(),p=(l.x-l.a)/(l.b-l.a)*100,n=Object.keys(S.bd).length;
return `<section class="${card} md:col-span-2"><div class="flex items-center justify-between gap-3"><div><div class="text-xs text-slate-500">Level</div><div class="text-2xl font-bold font-mono">${l.L} <span class="text-base font-semibold text-indigo-600 dark:text-indigo-400">${l.name}</span></div></div><div class="text-right text-sm"><b class="font-mono">${l.x} XP</b><div class="text-xs text-slate-500">${l.b-l.x} XP to level ${l.L+1}</div></div></div><div class="mt-2">${pbar(p,'bg-indigo-500')}</div><h3 class="font-semibold mt-4 mb-2">Badges <span class="text-xs font-normal text-slate-500">${n}/${BADGES.length} unlocked</span></h3><div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">${BADGES.map(b=>{const d=S.bd[b[0]];return `<div class="rounded-xl border p-2 ${d?'border-indigo-300 bg-indigo-50 dark:bg-indigo-950 dark:border-indigo-700':'border-slate-200 dark:border-slate-700 opacity-60'}"><div class="flex items-center gap-1 text-sm font-semibold"><svg class="w-4 h-4 ${d?'text-indigo-500':'text-slate-400'}" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>${b[1]}</div><div class="text-xs text-slate-500">${d?'Unlocked '+d:b[2]}</div></div>`}).join('')}</div><p class="text-xs text-slate-500 mt-3">XP: habit 10, task 10 to 30, focus 1 per minute, class present 5, journal entry 15, 7-day streak bonus 50.</p></section>`}
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],WD=[1,2,3,4,5,6,0],tmin=s=>{const p=s.split(':');return +p[0]*60+ +p[1]};
function todayCls(){const d=new Date().getDay();return S.courses.map((c,i)=>({c,i,s:(c.sl||[]).filter(x=>x.d===d)[0]})).filter(x=>x.s).sort((a,b)=>a.s.s.localeCompare(b.s.s))}
function addSlot(i){const d=+$('sld'+i).value,s=$('sls'+i).value,e=$('sle'+i).value;if(!s)return toast('Pick a start time');const c=S.courses[i];c.sl=c.sl||[];c.sl.push({d,s,e});save();render()}
function delSlot(i,j){S.courses[i].sl.splice(j,1);save();render()}
function ttGrid(){const rows=WD.map(d=>{const it=[];S.courses.forEach(c=>(c.sl||[]).forEach(s=>{if(s.d===d)it.push({n:c.n,s:s.s,e:s.e})}));it.sort((a,b)=>a.s.localeCompare(b.s));return `<div class="rounded-xl border ${d===new Date().getDay()?'border-sky-400':'border-slate-200 dark:border-slate-700'} p-2"><div class="text-xs font-semibold mb-1">${DN[d]}</div>${it.map(x=>`<div class="text-xs mb-1 rounded bg-sky-100 dark:bg-sky-900 p-1"><b>${esc(x.n)}</b><br>${x.s}${x.e?' - '+x.e:''}</div>`).join('')||'<div class="text-xs text-slate-400">Free</div>'}</div>`}).join('');return `<section class="${card} mt-4"><h3 class="font-semibold mb-2">Weekly Timetable</h3><div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-2">${rows}</div>${S.courses.length?'':em('Add a course, then set its weekly slots on its card.')}</section>`}
function slotEd(c,i){return `<div class="mt-3 border-t border-slate-100 dark:border-slate-700 pt-3"><div class="text-xs font-semibold mb-1">Weekly slots</div>${(c.sl||[]).map((s,j)=>`<div class="flex items-center justify-between text-sm"><span>${DN[s.d]} ${s.s}${s.e?' - '+s.e:''}</span><button onclick="delSlot(${i},${j})" class="tap text-xs text-rose-600">Remove</button></div>`).join('')}<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-2"><select id="sld${i}" class="${inp}">${WD.map(d=>`<option value="${d}">${DN[d]}</option>`).join('')}</select><input id="sls${i}" type="time" class="${inp}"><input id="sle${i}" type="time" class="${inp}">${btn('Add Slot',`addSlot(${i})`,'bg-sky-600 text-white')}</div></div>`}
/* push */
let swReg=null,st=null;
async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error(String(r.status));return r.json()}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').then(r=>{swReg=r}).catch(()=>{}));
const b64=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
function payload(){const n=S.ntf;return{device_id:n.did,lead:n.lead,rt:n.rt,tz:new Date().getTimezoneOffset(),tasks:S.tasks.filter(t=>!t.done&&t.due).map(t=>({id:t.id,t:t.t,due:new Date(t.due).getTime()})).filter(t=>!isNaN(t.due)),date:td(),habits_total:S.habits.length,habits_done:S.habits.filter(hDone).length,courses_total:todayCls().length,courses_marked:todayCls().filter(o=>marked(o.c)).length,slots:S.courses.flatMap(c=>(c.sl||[]).map(s=>({id:c.id+s.d+s.s,n:c.n,dow:s.d,s:tmin(s.s)}))),journal_today:S.journal.some(e=>e.date===td())}}
function schedSync(){if(!S.ntf||!S.ntf.push)return;clearTimeout(st);st=setTimeout(()=>api('/api/sync',payload()).catch(e=>{if(e.message==='404')pushSub().catch(()=>{})}),1500)}

<div class="my-4 flex justify-center">${S.fm==='ring'?`<div class="relative w-52 h-52"><svg viewBox="0 0 200 200" class="w-full h-full -rotate-90"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/><circle id="ring" cx="100" cy="100" r="90" fill="none" stroke="#818cf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="565" stroke-dashoffset="${(1-rem/(S.dur*60))*565}"/></svg><div id="tm" class="absolute inset-0 flex items-center justify-center font-mono text-4xl font-bold">${m}:${s}</div></div>`:`<div class="flex gap-3">${fl(['fm1',m])}${fl(['fs1',s])}</div><span id="tm" class="hidden">${m}:${s}</span>`}</div>
<div class="flex flex-wrap justify-center gap-2 mb-3">${[25,50,15,5].map(d=>btn(d+'m',`setDur(${d})`,S.dur===d?'bg-indigo-500 text-white':'bg-white/10')).join('')}</div>
<input id="ftopic" class="${inp} max-w-sm text-slate-900 dark:text-slate-100" placeholder="Topic">
<div class="flex flex-wrap justify-center gap-2 mt-3"><button id="sb" onclick="start()" class="tap rounded-xl bg-indigo-500 px-4 py-2 font-semibold">${run?'Pause':'Start'}</button>${btn('Reset','reset()','bg-white/10')}${btn('Log Session','logCur()','bg-white/10')}${btn(S.fm==='ring'?'Flip Clock View':'Standard View',"S.fm=S.fm==='ring'?'flip':'ring';save();render()",'bg-white/10')}</div></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4"><section class="${card}"><div class="flex gap-2 mb-2">${btn('+15m',"logSess(15,v('ftopic'))")}${btn('+30m',"logSess(30,v('ftopic'))")}</div><h3 class="font-semibold mb-1">Logged Focus Sessions</h3>${S.sess.map(x=>`<div class="flex justify-between text-sm py-1 border-b border-slate-100 dark:border-slate-700"><span>${esc(x.t)} <span class="text-xs text-slate-500">${x.date}</span></span><b class="font-mono">${hm(x.m)}</b></div>`).join('')||em('No sessions logged yet.')}</section>
<section class="${card}"><h3 class="font-semibold mb-2">Study Notes</h3><textarea class="${inp} h-40" placeholder="Jot down notes" oninput="S.notes=this.value;save()">${esc(S.notes)}</textarea></section></div>`}
function vJr(){const lk=S.locked;
return banner('from-fuchsia-900 via-purple-950 to-slate-900','Reflection','Daily Journal','Capture your mood and thoughts')+(lk?`<section class="${card} mt-4 text-center"><h3 class="font-semibold mb-2">Diary Locked</h3><input id="pin" type="password" inputmode="numeric" class="${inp} max-w-xs mx-auto" placeholder="Enter PIN (demo: 1234)" onkeydown="if(event.key==='Enter')unlock()"><button onclick="unlock()" class="tap mt-3 rounded-xl bg-fuchsia-600 text-white px-4 py-2 font-semibold">Unlock</button></section>`:`<section class="${card} mt-4"><div class="flex flex-wrap gap-2 mb-3">${moods.map(m=>btn(m,`S.mood='${m}';save();render()`,S.mood===m?'bg-fuchsia-600 text-white':'')).join('')}</div><div class="rounded-xl bg-fuchsia-50 dark:bg-fuchsia-950 p-3 flex items-center justify-between gap-2 mb-3"><span class="text-sm">${prompts[S.pi%prompts.length]}</span>${btn('Next Prompt',"S.pi++;save();render()")}</div><textarea id="jt" class="${inp} h-36" placeholder="Write your thoughts"></textarea><div class="flex flex-wrap gap-2 mt-2">${btn('Save Entry','saveEntry()','bg-fuchsia-600 text-white')}${btn('Voice Input','voice()')}${btn('Reflective Summary','summ()')}${btn('Lock Diary',"S.locked=true;save();render()")}</div><p id="sm" class="text-sm mt-3 text-slate-600 dark:text-slate-300"></p></section><section class="${card} mt-4"><h3 class="font-semibold mb-2">Entries</h3>${S.journal.map(e=>`<div class="py-2 border-b border-slate-100 dark:border-slate-700 text-sm"><b>${e.mood}</b> <span class="text-xs text-slate-500">${e.date}</span><p class="mt-1 whitespace-pre-wrap">${esc(e.text)}</p></div>`).join('')||em('No journal entries yet.')}</section>`)}
const V={home:vHome,money:vMoney,att:vAtt,hab:vHab,task:vTask,foc:vFoc,jr:vJr};
setInterval(()=>check(),30000);setTimeout(()=>check(),1500);setTimeout(()=>schedSync(),2500);
function render(){const dark=theme(),ini=(S.name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(),w=S.wide?'max-w-6xl':'max-w-md',nav=tabs.map(t=>`<button onclick="go('${t[0]}')" class="tap flex items-center justify-center gap-2 rounded-xl px-3 py-2 text-sm font-medium ${view===t[0]?'bg-indigo-600 text-white':'hover:bg-slate-100 dark:hover:bg-slate-700'}">${icon(t[2])}${t[1]}</button>`).join('');
$('app').innerHTML=`<header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700"><div class="${w} mx-auto px-4 py-2"><div class="flex items-center justify-between gap-2"><button onclick="editName=true;ovr()" class="tap flex items-center gap-2 text-left"><span class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center text-sm font-bold">${esc(ini)}</span><span class="font-semibold truncate">Welcome, ${esc(S.name)}</span></button><div class="flex gap-2">${btn(dark?'Light':'Dark','setTheme()')}<span class="hidden md:inline-flex">${btn(S.wide?'Phone View':'Wide View',"S.wide=!S.wide;save();render()")}</span><span class="md:hidden">${btn('Menu',"menu=!menu;render()")}</span></div></div><nav class="${menu?'grid':'hidden'} md:grid grid-cols-1 md:grid-cols-7 gap-1 mt-2">${nav}</nav></div></header><main class="${w} mx-auto px-4 py-4">${V[view]()}</main>`;ovr()}
render();
</script></body></html>
